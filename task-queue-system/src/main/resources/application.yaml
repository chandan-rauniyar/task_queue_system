spring:
  application:
    name: task-queue-system

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: task-queue-workers
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.taskqueue.model"
        spring.json.add.type.headers: false
        spring.json.value.default.type: "com.taskqueue.model.JobEvent"

    listener:
      ack-mode: manual_immediate

  mail:
    host: smtp.gmail.com
    port: 587
    username: codewithmyself2@gmail.com
    password: xwfdzcoyuqzmycro
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  security:
    user:
      name: ignored
      password: ignored

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,kafkametrics
      base-path: /actuator

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: "YourJwtSecretKeyMustBe32CharsLong!!"
    expiry-hours: 24

  encryption:
    key: "MySecretKey1234567890123456ABCDE"

  kafka:
    topics:
      high-priority: jobs.high-priority
      normal-priority: jobs.normal-priority
      low-priority: jobs.low-priority
      dead-letter: jobs.dead-letter

  redis:
    api-key-cache-ttl: 300
    rate-limit-window: 60

  retry:
    max-attempts: 3
    initial-delay-seconds: 30
    multiplier: 2

  admin:
    allowed-ip: "127.0.0.1"
    path-prefix: "/admin"

  webhook:
    timeout-seconds: 10
    max-retries: 3